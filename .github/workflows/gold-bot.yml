name: Vietnam Gold Price Bot

on:
  push:
    branches:
      - main
  schedule:
    # Run every 30 minutes between 1 AM and 11 AM UTC (which is 8 AM to 6 PM Vietnam Time)
    - cron: '0,30 1-11 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  check-price:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install dependencies
        run: go mod download

      - name: Run Gold Checker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: go run cmd/check_gold/main.go

      - name: Commit state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gold_price_state.json
          git diff-index --quiet HEAD || (git commit -m "chore: update gold price state" && git pull --rebase origin main && git push)
