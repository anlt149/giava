name: Vietnam Gold Price Bot

on:
  schedule:
    # Run every 30 minutes between 1 AM and 11 AM UTC (which is 8 AM to 6 PM Vietnam Time)
    - cron: '*/30 1-11 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gold Checker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_gold.py

      - name: Commit state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gold_price_state.json
          git diff-index --quiet HEAD || (git commit -m "chore: update gold price state" && git pull --rebase origin main && git push)
